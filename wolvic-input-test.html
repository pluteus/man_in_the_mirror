<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wolvic入力テスト</title>
<style>
  body{
    margin:0; padding:20px; font-family:sans-serif; background:#0a0e14; color:#e6edf3;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  button{
    font-size:20px; padding:20px 30px; border-radius:12px; border:none;
    background:#4f9dff; color:#fff; cursor:pointer;
  }
  #count{ font-size:40px; font-weight:bold; }
  #result{ font-size:16px; text-align:center; white-space:pre-wrap; }
</style>
</head>
<body>
  <h2>Wolvic 入力テスト</h2>
  <div id="count">0</div>
  <button id="btn1">ここをタップ/クリック</button>
  <div id="result">まだ押されていません</div>

  <script>
    // 意図的にプレーンなJS/CSSのみで構成。canvasやthree.js、複雑なpointer-events設定は一切なし。
    var n = 0;
    var countEl = document.getElementById('count');
    var resultEl = document.getElementById('result');
    var btn = document.getElementById('btn1');

    function report(eventName){
      n++;
      countEl.textContent = n;
      resultEl.textContent = '直近のイベント: ' + eventName + ' / userAgent: ' + navigator.userAgent;
    }

    btn.addEventListener('click', function(){ report('click'); });
    btn.addEventListener('pointerdown', function(e){ report('pointerdown (type=' + e.pointerType + ')'); });
    btn.addEventListener('touchstart', function(){ report('touchstart'); });
  </script>
</body>
</html>
